<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZONE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0a0a0a; --bg-side: #050505; --bg-elev: #141414;
  --bg-hover: #1c1c1c; --bg-input: #161616;
  --text: #f5f5f5; --text-dim: #999999; --text-dimmer: #5a5a5a;
  --border: #262626; --border-hi: #3a3a3a;
  --accent: #ffffff;
  --accent-bg: rgba(255,255,255,0.08);
  --accent-bg-2: rgba(255,255,255,0.15);
  --green: #4ade80; --red: #f87171; --yellow: #fbbf24;
  --radius: 12px; --radius-lg: 16px;
}
[data-theme="light"] {
  --bg: #ffffff; --bg-side: #f7f7f7; --bg-elev: #f2f2f2;
  --bg-hover: #eaeaea; --bg-input: #f2f2f2;
  --text: #0a0a0a; --text-dim: #5a5a5a; --text-dimmer: #999999;
  --border: #e0e0e0; --border-hi: #c4c4c4;
  --accent: #000000;
  --accent-bg: rgba(0,0,0,0.06);
  --accent-bg-2: rgba(0,0,0,0.12);
  --green: #16a34a; --red: #dc2626; --yellow: #ca8a04;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Cairo', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  font-size: 15px; line-height: 1.6;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea { font-family: inherit; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUpFade { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }
@keyframes popIn { 0% { transform: scale(0.7); opacity: 0; } 50% { transform: scale(1.1); } 100% { transform: scale(1); opacity: 1; } }
@keyframes scaleInBounce { 0% { opacity: 0; transform: scale(0.85); } 60% { opacity: 1; transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseSoft { 0%, 100% { opacity: 1; } 50% { opacity: 0.75; } }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes floatRotate { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-10px) rotate(-3deg); } }
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
@keyframes blink { 0%, 45% { opacity: 1; } 55%, 100% { opacity: 0; } }
@keyframes bnc { 0%, 80%, 100% { transform: scale(0.5); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

#app { display: flex; height: 100vh; }

/* SIDEBAR */
#sidebar {
  width: 260px; background: var(--bg-side);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: width 0.25s ease, transform 0.25s ease;
  flex-shrink: 0;
}
#sidebar.collapsed { width: 0; overflow: hidden; border-left: none; }
.side-top { padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.side-brand { font-size: 15px; font-weight: 800; display: flex; align-items: center; gap: 2px; }
.side-brand .ai { background: var(--text); color: var(--bg); padding: 1px 7px; border-radius: 5px; font-size: 11px; margin-right: 6px; }
.side-close { font-size: 18px; color: var(--text-dim); padding: 2px 8px; border-radius: 6px; }
.side-close:hover { background: var(--bg-hover); color: var(--text); }
.side-actions { padding: 8px 12px; display: flex; gap: 6px; }
.side-btn {
  flex: 1; padding: 9px 12px; background: var(--bg-elev);
  border: 1px solid var(--border); border-radius: 9px;
  font-size: 12.5px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap;
}
.side-btn:hover { background: var(--bg-hover); border-color: var(--border-hi); }
.chats-wrap { flex: 1; overflow-y: auto; padding: 4px 8px; }
.chats-wrap::-webkit-scrollbar { width: 5px; }
.chats-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.chat-row {
  padding: 8px 10px; border-radius: 8px; cursor: pointer;
  font-size: 13.5px; color: var(--text-dim);
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 1px; position: relative;
}
.chat-row:hover { background: var(--bg-hover); color: var(--text); }
.chat-row.active { background: var(--bg-elev); color: var(--text); }
.chat-row .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chat-row .d { opacity: 0; font-size: 14px; padding: 2px 6px; color: var(--text-dimmer); border-radius: 5px; }
.chat-row:hover .d { opacity: 1; }
.chat-row .d:hover { background: var(--bg-elev); color: var(--text); }
.side-user { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer; }
.side-user:hover { background: var(--bg-hover); }
.u-avatar { width: 34px; height: 34px; border-radius: 8px; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; flex-shrink: 0; overflow: hidden; }
.u-avatar img { width: 100%; height: 100%; object-fit: cover; }
.u-info { flex: 1; min-width: 0; }
.u-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-sub { font-size: 11px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.u-settings { color: var(--text-dim); font-size: 15px; padding: 4px; border-radius: 6px; }

/* MAIN */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#header { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; min-height: 52px; }
.hdr-btn { padding: 6px 10px; border-radius: 8px; font-size: 16px; color: var(--text-dim); }
.hdr-btn:hover { background: var(--bg-hover); color: var(--text); }
.hdr-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#messages { flex: 1; overflow-y: auto; padding: 24px 20px 8px; display: flex; flex-direction: column; gap: 24px; }
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* WELCOME */
#welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 20px; gap: 24px; }
.w-hero { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.w-orb { width: 90px; height: 90px; border-radius: 26px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-size: 42px; color: var(--bg); }
.w-logo-big { font-size: 42px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
.w-logo-big .ai { background: var(--accent); color: var(--bg); padding: 6px 18px; border-radius: 12px; font-size: 32px; }
.w-tagline { font-size: 15px; color: var(--text-dim); max-width: 480px; }
.w-tagline strong { color: var(--text); font-weight: 700; }
.w-features { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.w-feature { padding: 6px 12px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 20px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
.w-feature i { color: var(--text); font-size: 11px; }
.w-cta { padding: 12px 26px; background: var(--accent); color: var(--bg); border-radius: 12px; font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; position: relative; overflow: hidden; }
.w-cta:hover { transform: translateY(-3px); opacity: 0.92; }
.suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; max-width: 580px; width: 100%; margin-top: 12px; }
.sugg { padding: 12px 14px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px; text-align: right; }
.sugg:hover { border-color: var(--border-hi); background: var(--bg-hover); }
.sugg-t { font-size: 13.5px; font-weight: 600; margin-bottom: 3px; }
.sugg-d { font-size: 12px; color: var(--text-dim); }

/* MESSAGES */
.msg { display: flex; gap: 14px; max-width: 780px; width: 100%; margin: 0 auto; }
.m-avatar { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; overflow: hidden; }
.m-avatar img { width: 100%; height: 100%; object-fit: cover; }
.msg.user .m-avatar { background: var(--text); color: var(--bg); }
.msg.ai .m-avatar { background: var(--bg-elev); border: 1px solid var(--border); color: var(--text); }
.m-body { flex: 1; min-width: 0; }
.m-name { font-size: 12.5px; font-weight: 600; color: var(--text-dim); margin-bottom: 5px; }
.m-content { font-size: 15px; line-height: 1.75; word-wrap: break-word; overflow-wrap: break-word; }
.m-content p { margin: 10px 0; }
.m-content p:first-child { margin-top: 0; }
.m-content p:last-child { margin-bottom: 0; }
.m-content ul, .m-content ol { margin: 10px 0; padding-right: 22px; }
.m-content li { margin: 4px 0; }
.m-content h1, .m-content h2, .m-content h3 { margin: 14px 0 8px; font-weight: 700; }
.m-content h1 { font-size: 20px; } .m-content h2 { font-size: 18px; } .m-content h3 { font-size: 16px; }
.m-content blockquote { border-right: 3px solid var(--text); padding: 4px 12px; margin: 10px 0; color: var(--text-dim); background: var(--accent-bg); border-radius: 6px; }
.m-content table { border-collapse: collapse; margin: 12px 0; width: 100%; font-size: 13.5px; }
.m-content th, .m-content td { border: 1px solid var(--border); padding: 8px 12px; text-align: right; }
.m-content th { background: var(--bg-elev); font-weight: 700; }
.m-content a { color: var(--text); text-decoration: none; border-bottom: 1px dashed var(--border-hi); }
.m-content a:hover { border-bottom-style: solid; border-bottom-color: var(--text); }
.m-content code:not(pre code) { background: var(--bg-elev); border: 1px solid var(--border); padding: 2px 6px; border-radius: 5px; font-family: 'JetBrains Mono', monospace; font-size: 12.5px; color: var(--text); }

/* CODE BLOCK */
.code-block { background: #0a0a0a; border: 1px solid var(--border); border-radius: 10px; margin: 12px 0; overflow: hidden; direction: ltr; }
[data-theme="light"] .code-block { background: #f8f8f8; }
.code-header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #141414; border-bottom: 1px solid #222; font-size: 12px; }
[data-theme="light"] .code-header { background: #ececec; border-bottom-color: #ddd; }
.code-lang { color: #888; font-family: 'JetBrains Mono', monospace; text-transform: uppercase; font-weight: 600; }
.code-name { color: #ccc; font-family: 'JetBrains Mono', monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
[data-theme="light"] .code-name { color: #333; }
.code-actions { display: flex; gap: 4px; margin-left: auto; }
.code-btn { padding: 3px 9px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.08); color: #ccc; border-radius: 5px; font-size: 11px; display: flex; align-items: center; gap: 4px; min-width: 60px; justify-content: center; }
.code-btn:hover { background: rgba(255,255,255,0.14); color: #fff; }
.code-btn.success-anim { background: rgba(74,222,128,0.2) !important; border-color: rgba(74,222,128,0.5) !important; color: #4ade80 !important; }
.code-block pre { padding: 14px 16px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.65; color: #e0e0e0; margin: 0; max-height: 600px; }
[data-theme="light"] .code-block pre { color: #1a1a1a; }

/* THINK BLOCK */
.think-block { margin: 8px 0 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--accent-bg); overflow: hidden; }
.think-hdr { padding: 10px 14px; display: flex; align-items: center; gap: 10px; font-size: 12.5px; color: var(--text); font-weight: 600; cursor: pointer; }
.think-hdr:hover { background: var(--bg-hover); }
.think-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text); flex-shrink: 0; }
.think-hdr .time { color: var(--text-dimmer); font-weight: 400; font-size: 11.5px; }
.think-hdr .arrow { margin-right: auto; transition: transform 0.3s ease; color: var(--text-dimmer); font-size: 10px; }
.think-block.open .arrow { transform: rotate(180deg); }
.think-body { max-height: 0; overflow: hidden; transition: max-height 0.4s ease, padding 0.3s ease; padding: 0 14px; color: var(--text-dim); font-size: 13px; line-height: 1.75; white-space: pre-wrap; }
.think-block.open .think-body { max-height: 6000px; padding: 4px 14px 14px; border-top: 1px solid var(--border); margin-top: 4px; }

/* LIVE */
.thinking-live, .search-live { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: var(--accent-bg); border: 1px solid var(--border-hi); border-radius: 12px; margin: 8px 0; }
.brain-anim, .search-anim-icon { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: var(--text); }
.thinking-live-text, .search-live-text { font-size: 13.5px; color: var(--text); font-weight: 600; }
.thinking-live-sub { font-size: 11.5px; color: var(--text-dim); margin-top: 2px; }

.cursor-blink { display: inline-block; width: 2px; height: 1.05em; background: var(--text); vertical-align: text-bottom; margin-right: 1px; animation: blink 0.9s infinite; }
.typing-row { display: flex; gap: 4px; align-items: center; padding: 2px 0; }
.typing-row span { width: 6px; height: 6px; background: var(--text-dim); border-radius: 50%; animation: bnc 1.3s infinite ease-in-out both; }
.typing-row span:nth-child(1) { animation-delay: -0.3s; }
.typing-row span:nth-child(2) { animation-delay: -0.15s; }
.spinner { width: 18px; height: 18px; border: 2px solid var(--border-hi); border-top-color: var(--text); border-radius: 50%; animation: spin 0.7s linear infinite; flex-shrink: 0; }

.m-actions { display: flex; gap: 4px; margin-top: 8px; opacity: 0; flex-wrap: wrap; align-items: center; }
.msg:hover .m-actions { opacity: 1; }
.m-act { padding: 4px 9px; border: 1px solid var(--border); border-radius: 6px; font-size: 11.5px; color: var(--text-dim); display: flex; align-items: center; gap: 4px; }
.m-act:hover { color: var(--text); border-color: var(--border-hi); background: var(--bg-elev); }
.m-act.liked { color: var(--green); border-color: rgba(74,222,128,0.4); background: rgba(74,222,128,0.08); }
.m-act.disliked { color: var(--red); border-color: rgba(248,113,113,0.4); background: rgba(248,113,113,0.08); }

/* SOURCES */
.sources-block { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg-elev); overflow: hidden; }
.sources-hdr { padding: 8px 14px; font-size: 12px; color: var(--text); font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
.sources-hdr:hover { background: var(--bg-hover); }
.sources-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; padding: 0 14px; }
.sources-block.open .sources-body { max-height: 600px; padding: 4px 14px 12px; border-top: 1px solid var(--border); }
.source-item { padding: 6px 0; font-size: 12.5px; display: flex; align-items: center; gap: 8px; }
.source-item a { color: var(--text); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.source-item a:hover { text-decoration: underline; }
.source-num { width: 20px; height: 20px; border-radius: 50%; background: var(--accent-bg); color: var(--text); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }

/* INPUT */
#input-area { padding: 8px 20px 20px; background: var(--bg); }
#attachments { max-width: 780px; margin: 0 auto 8px; display: none; flex-wrap: wrap; gap: 8px; }
#attachments.show { display: flex; }
.attach-chip { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 6px; background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px; font-size: 12px; color: var(--text-dim); max-width: 220px; }
.attach-thumb { width: 36px; height: 36px; border-radius: 6px; background: var(--bg-hover); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; overflow: hidden; }
.attach-thumb img { width: 100%; height: 100%; object-fit: cover; }
.attach-info { flex: 1; min-width: 0; }
.attach-name { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.attach-size { font-size: 11px; color: var(--text-dimmer); }
.attach-x { background: transparent; color: var(--text-dim); font-size: 14px; padding: 2px 6px; border-radius: 5px; }
.attach-x:hover { background: var(--bg-hover); color: var(--red); }
#input-box { max-width: 780px; margin: 0 auto; background: var(--bg-input); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
#input-box:focus-within { border-color: var(--border-hi); }
#input-toolbar { display: flex; gap: 4px; padding: 8px 10px 4px; align-items: center; }
.tool-btn { padding: 5px 10px; border-radius: 8px; font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; border: 1px solid transparent; white-space: nowrap; }
.tool-btn:hover { background: var(--bg-hover); color: var(--text); }
.tool-btn.active { background: var(--accent-bg); color: var(--text); border-color: var(--border-hi); }
.tool-btn i { font-size: 13px; }
#input-row { display: flex; align-items: flex-end; padding: 4px 10px 10px; gap: 8px; }
#user-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 15px; resize: none; outline: none; max-height: 200px; padding: 6px 0; line-height: 1.5; }
#user-input::placeholder { color: var(--text-dimmer); }
#send-btn { width: 34px; height: 34px; background: var(--accent); color: var(--bg); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
#send-btn:hover:not(:disabled) { transform: scale(1.08); opacity: 0.92; }
#send-btn:disabled { opacity: 0.25; cursor: not-allowed; }
#send-btn.stop-mode { background: var(--red); color: #fff; }
#input-hint { max-width: 780px; margin: 8px auto 0; text-align: center; font-size: 11.5px; color: var(--text-dimmer); }

/* SETTINGS */
#settings-page { position: absolute; inset: 0; background: var(--bg); z-index: 200; display: none; flex-direction: column; overflow-y: auto; }
#settings-page.show { display: flex; }
.set-hdr { padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; position: sticky; top: 0; background: var(--bg); z-index: 10; }
.set-back { font-size: 20px; padding: 4px 8px; border-radius: 8px; }
.set-back:hover { background: var(--bg-hover); }
.set-title { font-size: 18px; font-weight: 700; }
.set-body { flex: 1; max-width: 660px; width: 100%; margin: 0 auto; padding: 24px 20px 60px; }
.profile-card { background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.big-avatar { width: 72px; height: 72px; border-radius: 14px; background: var(--text); color: var(--bg); display: flex; align-items: center; justify-cont
